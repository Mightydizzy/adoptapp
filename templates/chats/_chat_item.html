<a href="{% url 'chat_detail' chat.id %}"
   class="list-group-item list-group-item-action d-flex gap-3 py-3">

  <!-- Foto mascota -->
  <img src="{{ chat.mascota.foto.url }}"
       alt="{{ chat.mascota.nombre }}"
       class="rounded"
       style="width: 70px; height: 70px; object-fit: cover;">

  <!-- Contenido -->
  <div class="w-100">

    <div class="d-flex justify-content-between">
      <h6 class="mb-1">{{ chat.mascota.nombre }}</h6>
      <small class="text-muted">
        {{ chat.created_at|date:"d M Y" }}
      </small>
    </div>

    {% if tipo == "adoptante" %}
      <p class="mb-1">
        Conversas con <strong>{{ chat.publicador.username }}</strong>
      </p>
      <small class="text-muted">
        Estás interesado en esta mascota
      </small>
    {% else %}
      <p class="mb-1">
        Interesado: <strong>{{ chat.adoptante.username }}</strong>
      </p>
      <small class="text-muted">
        Está interesado en tu mascota
      </small>
    {% endif %}

  </div>
</a>
